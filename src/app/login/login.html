<h3>Faça seu login</h3>

<div class="alert alert-success" *ngIf="mensagem.length>0">
    {{mensagem}}
</div>

<div class="row">
        <div class="col">           
            <label class="form-label" >email:</label>
            <input type="email" id="txtEmail" name="email" class="form-control" [(ngModel)]="obj.email"><br>
            <label class="form-label" for="txtSenha">senha:</label>
            <input type="password" id="txtSenha" name="senha" class="form-control" [(ngModel)]="obj.senha"><br>
            <button class="btn btn-outline-success w-100"(click)="gravar()">Entrar</button>
        </div>
        <div class="col">
            Caso tenha esquecido sua senha<br>
            <a href="reenvio" class="btn btn-outline-warning w-100">reenviar senha</a>
            <br><br>
            Ainda não tem cadastro<br>
            <a href="cadastro" class="btn btn-outline-primary w-100">novo cadastro</a>
        </div>
</div>
